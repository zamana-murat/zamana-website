<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 798" width="800" height="798" role="img" aria-labelledby="title desc" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Departman ve sektör çarkı: merkezde Claude ve ekip</title>
  <desc id="desc">Ortada Claude ve ekip. Üstte 12 departman: Satış, Pazarlama, Müşteri Hizmetleri, Operasyon, Satınalma, İhracat, Finans, İnsan Kaynakları, Hukuk, Bilgi Teknolojileri, İdari İşler, Liderlik. Altta 7 sektör ve KOBİ: Perakende ve E-Ticaret, Turizm ve Otelcilik, Üretim ve İmalat, Eğitim ve Akademi, Sağlık, Kamu Kurumları, Finansal Hizmetler, Küçük İşletme (KOBİ). Aynı araç, her rolde farklı değer üretir.</desc>

  <rect x="0" y="0" width="800" height="798" rx="16" fill="#ffffff"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#0f2855">Departman ve sektör çarkı</text>
  <text x="40" y="88" font-size="16" font-weight="500" fill="#1a2238">Aynı araç, her rolde farklı değer</text>

  <!-- Panel: 12 departments -->
  <rect x="24" y="110" width="752" height="302" rx="16" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <text x="48" y="144" font-size="20" font-weight="700" fill="#0f2855">12 departman</text>

  <g fill="#ffffff" stroke="#c5cdda" stroke-width="2">
    <rect x="40" y="160" width="232" height="50" rx="10"/>
    <rect x="284" y="160" width="232" height="50" rx="10"/>
    <rect x="528" y="160" width="232" height="50" rx="10"/>
    <rect x="40" y="222" width="232" height="50" rx="10"/>
    <rect x="284" y="222" width="232" height="50" rx="10"/>
    <rect x="528" y="222" width="232" height="50" rx="10"/>
    <rect x="40" y="284" width="232" height="50" rx="10"/>
    <rect x="284" y="284" width="232" height="50" rx="10"/>
    <rect x="528" y="284" width="232" height="50" rx="10"/>
    <rect x="40" y="346" width="232" height="50" rx="10"/>
    <rect x="284" y="346" width="232" height="50" rx="10"/>
    <rect x="528" y="346" width="232" height="50" rx="10"/>
  </g>
  <g font-size="18" font-weight="500" fill="#1a2238" text-anchor="middle">
    <text x="156" y="191">Satış</text>
    <text x="400" y="191">Pazarlama</text>
    <text x="644" y="191">Müşteri Hizmetleri</text>
    <text x="156" y="253">Operasyon</text>
    <text x="400" y="253">Satınalma</text>
    <text x="644" y="253">İhracat</text>
    <text x="156" y="315">Finans</text>
    <text x="400" y="315">İnsan Kaynakları</text>
    <text x="644" y="315">Hukuk</text>
    <text x="156" y="377">Bilgi Teknolojileri</text>
    <text x="400" y="377">İdari İşler</text>
    <text x="644" y="377">Liderlik</text>
  </g>

  <!-- Hub -->
  <line x1="400" y1="412" x2="400" y2="438" stroke="#c9a84c" stroke-width="3"/>
  <line x1="400" y1="508" x2="400" y2="534" stroke="#c9a84c" stroke-width="3"/>
  <rect x="270" y="438" width="260" height="70" rx="35" fill="#0f2855" stroke="#c9a84c" stroke-width="3"/>
  <text x="400" y="481" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Claude + ekip</text>

  <!-- Panel: 7 sectors and SME -->
  <rect x="24" y="534" width="752" height="240" rx="16" fill="#f7f0dc" stroke="#c9a84c" stroke-width="2"/>
  <text x="48" y="568" font-size="20" font-weight="700" fill="#0f2855">7 sektör ve KOBİ</text>

  <g fill="#ffffff" stroke="#c9a84c" stroke-width="2">
    <rect x="40" y="584" width="232" height="50" rx="10"/>
    <rect x="284" y="584" width="232" height="50" rx="10"/>
    <rect x="528" y="584" width="232" height="50" rx="10"/>
    <rect x="40" y="646" width="232" height="50" rx="10"/>
    <rect x="284" y="646" width="232" height="50" rx="10"/>
    <rect x="528" y="646" width="232" height="50" rx="10"/>
    <rect x="162" y="708" width="232" height="50" rx="10"/>
  </g>
  <rect x="406" y="708" width="232" height="50" rx="10" fill="#ffffff" stroke="#0f2855" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-size="18" font-weight="500" fill="#1a2238" text-anchor="middle">
    <text x="156" y="615">Perakende, E-Ticaret</text>
    <text x="400" y="615">Turizm ve Otelcilik</text>
    <text x="644" y="615">Üretim ve İmalat</text>
    <text x="156" y="677">Eğitim ve Akademi</text>
    <text x="400" y="677">Sağlık</text>
    <text x="644" y="677">Kamu Kurumları</text>
    <text x="278" y="739">Finansal Hizmetler</text>
    <text x="522" y="739">Küçük İşletme (KOBİ)</text>
  </g>
</svg>

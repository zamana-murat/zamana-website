<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" role="img" aria-labelledby="title desc" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">ROI hesabının akışı: değer tarafı ve maliyet tarafı net faydada birleşir</title>
  <desc id="desc">Sol sütun değer tarafı: aylık kazanılan saat eşittir kişi sayısı çarpı haftalık kazanılan saat çarpı 4,33; işe dönüşen saat eşittir aylık kazanılan saat çarpı dönüşüm payı; aylık değer eşittir işe dönüşen saat çarpı saatlik yüklü maliyet. Sağ sütun maliyet tarafı: aylık Claude maliyeti USD olarak toplam plan fiyatı; TL'ye çevirmek için USD çarpı kur; aylık maliyet varsayılan olarak KDV hariç, KDV dahil seçilirse çarpı 1,20. İki taraf net faydada birleşir: aylık değer eksi aylık maliyet. Sonra geri dönüş oranı: net fayda bölü aylık maliyet çarpı 100. Not: 4,33 bir ayın hafta sayısıdır, 52 bölü 12.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a84c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="760" rx="16" fill="#ffffff"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#0f2855">ROI hesabı adım adım</text>
  <text x="40" y="88" font-size="16" font-weight="500" fill="#1a2238">Değer ve maliyet ayrı hesaplanır, net faydada buluşur</text>

  <!-- Lane headers -->
  <text x="210" y="132" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">Değer tarafı</text>
  <text x="590" y="132" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">Maliyet tarafı</text>

  <!-- Arrows -->
  <g stroke="#c9a84c" stroke-width="2" marker-end="url(#arrow)">
    <line x1="210" y1="232" x2="210" y2="262"/>
    <line x1="210" y1="352" x2="210" y2="382"/>
    <line x1="590" y1="232" x2="590" y2="262"/>
    <line x1="590" y1="352" x2="590" y2="382"/>
    <line x1="210" y1="472" x2="320" y2="504"/>
    <line x1="590" y1="472" x2="480" y2="504"/>
    <line x1="400" y1="588" x2="400" y2="614"/>
  </g>

  <!-- Value lane -->
  <rect x="40" y="146" width="340" height="84" rx="10" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <text x="210" y="180" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">Aylık kazanılan saat</text>
  <text x="210" y="208" font-size="16" font-weight="500" fill="#1a2238" text-anchor="middle">Kişi sayısı × haftalık saat × 4,33</text>

  <rect x="40" y="266" width="340" height="84" rx="10" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <text x="210" y="300" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">İşe dönüşen saat</text>
  <text x="210" y="328" font-size="16" font-weight="500" fill="#1a2238" text-anchor="middle">Aylık kazanılan saat × dönüşüm payı</text>

  <rect x="40" y="386" width="340" height="84" rx="10" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <text x="210" y="420" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">Aylık değer</text>
  <text x="210" y="448" font-size="16" font-weight="500" fill="#1a2238" text-anchor="middle">İşe dönüşen saat × saatlik yüklü maliyet</text>

  <!-- Cost lane -->
  <rect x="420" y="146" width="340" height="84" rx="10" fill="#f7f0dc" stroke="#c9a84c" stroke-width="2"/>
  <text x="590" y="180" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">Aylık Claude maliyeti</text>
  <text x="590" y="208" font-size="16" font-weight="500" fill="#1a2238" text-anchor="middle">Toplam plan fiyatı, USD</text>

  <rect x="420" y="266" width="340" height="84" rx="10" fill="#f7f0dc" stroke="#c9a84c" stroke-width="2"/>
  <text x="590" y="300" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">TL'ye çevir</text>
  <text x="590" y="328" font-size="16" font-weight="500" fill="#1a2238" text-anchor="middle">USD × kur (TL/USD)</text>

  <rect x="420" y="386" width="340" height="84" rx="10" fill="#f7f0dc" stroke="#c9a84c" stroke-width="2"/>
  <text x="590" y="420" font-size="18" font-weight="700" fill="#0f2855" text-anchor="middle">Aylık maliyet</text>
  <text x="590" y="448" font-size="16" font-weight="500" fill="#1a2238" text-anchor="middle">KDV hariç; KDV dahilse × 1,20</text>

  <!-- Results -->
  <rect x="200" y="508" width="400" height="78" rx="10" fill="#e8edf6" stroke="#c9a84c" stroke-width="3"/>
  <text x="400" y="540" font-size="20" font-weight="700" fill="#0f2855" text-anchor="middle">Net fayda</text>
  <text x="400" y="568" font-size="16" font-weight="500" fill="#1a2238" text-anchor="middle">Aylık değer − aylık maliyet</text>

  <rect x="200" y="618" width="400" height="78" rx="10" fill="#0f2855"/>
  <text x="400" y="650" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Geri dönüş oranı</text>
  <text x="400" y="678" font-size="16" font-weight="500" fill="#f7f0dc" text-anchor="middle">Net fayda / aylık maliyet × 100</text>

  <text x="40" y="734" font-size="16" font-weight="500" fill="#1a2238">4,33: bir ayın hafta sayısı (52 / 12)</text>
</svg>

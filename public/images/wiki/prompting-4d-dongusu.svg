<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-labelledby="title desc" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">4D Çerçevesi döngüsü: Delegation, Description, Discernment, Diligence</title>
  <desc id="desc">Ortada AI Fluency, çevresinde saat yönünde dört yetkinlik: D1 Delegation (Devretme), hangi iş kimde; D2 Description (Tanımlama), nasıl anlatırım; D3 Discernment (Ayırt Etme), çıktı iyi mi; D4 Diligence (Sorumluluk), sorumluluk kimde. Discernment'tan Description'a kesikli bir geri dönüş oku var: çıktı yetersizse prompt iyileştirilip tekrar denenir. Sıra zorunlu değildir, her D bir giriş noktası olabilir.</desc>

  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2855"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a84c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="550" rx="16" fill="#ffffff"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#0f2855">4D Çerçevesi</text>
  <text x="40" y="88" font-size="16" font-weight="500" fill="#1a2238">Dört yetkinlik, sürekli bir döngü</text>

  <!-- Cycle arrows -->
  <line x1="342" y1="176" x2="458" y2="176" stroke="#0f2855" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <line x1="560" y1="238" x2="560" y2="354" stroke="#0f2855" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <line x1="458" y1="416" x2="342" y2="416" stroke="#0f2855" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <line x1="190" y1="354" x2="190" y2="238" stroke="#0f2855" stroke-width="2" marker-end="url(#arrow-navy)"/>

  <!-- Description and Discernment inner loop -->
  <line x1="690" y1="354" x2="690" y2="238" stroke="#c9a84c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gold)"/>
  <text x="625" y="290" text-anchor="middle" font-size="16" font-weight="500" fill="#0f2855">yetersizse</text>
  <text x="625" y="312" text-anchor="middle" font-size="16" font-weight="500" fill="#0f2855">geri dön</text>

  <!-- Center -->
  <circle cx="400" cy="296" r="56" fill="#f7f0dc" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#0f2855">AI</text>
  <text x="400" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#0f2855">Fluency</text>

  <!-- D1 Delegation (top left) -->
  <rect x="40" y="116" width="300" height="120" rx="10" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <circle cx="84" cy="176" r="24" fill="#0f2855"/>
  <text x="84" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">D1</text>
  <text x="124" y="162" font-size="22" font-weight="700" fill="#0f2855">Delegation</text>
  <text x="124" y="188" font-size="18" font-weight="500" fill="#0f2855">Devretme</text>
  <text x="124" y="214" font-size="16" font-weight="500" fill="#1a2238">Hangi iş kimde?</text>

  <!-- D2 Description (top right) -->
  <rect x="460" y="116" width="300" height="120" rx="10" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <circle cx="504" cy="176" r="24" fill="#0f2855"/>
  <text x="504" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">D2</text>
  <text x="544" y="162" font-size="22" font-weight="700" fill="#0f2855">Description</text>
  <text x="544" y="188" font-size="18" font-weight="500" fill="#0f2855">Tanımlama</text>
  <text x="544" y="214" font-size="16" font-weight="500" fill="#1a2238">Nasıl anlatırım?</text>

  <!-- D3 Discernment (bottom right) -->
  <rect x="460" y="356" width="300" height="120" rx="10" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <circle cx="504" cy="416" r="24" fill="#0f2855"/>
  <text x="504" y="422" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">D3</text>
  <text x="544" y="402" font-size="22" font-weight="700" fill="#0f2855">Discernment</text>
  <text x="544" y="428" font-size="18" font-weight="500" fill="#0f2855">Ayırt Etme</text>
  <text x="544" y="454" font-size="16" font-weight="500" fill="#1a2238">Çıktı iyi mi?</text>

  <!-- D4 Diligence (bottom left) -->
  <rect x="40" y="356" width="300" height="120" rx="10" fill="#e8edf6" stroke="#c5cdda" stroke-width="2"/>
  <circle cx="84" cy="416" r="24" fill="#0f2855"/>
  <text x="84" y="422" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">D4</text>
  <text x="124" y="402" font-size="22" font-weight="700" fill="#0f2855">Diligence</text>
  <text x="124" y="428" font-size="18" font-weight="500" fill="#0f2855">Sorumluluk</text>
  <text x="124" y="454" font-size="16" font-weight="500" fill="#1a2238">Sorumluluk kimde?</text>

  <text x="400" y="522" text-anchor="middle" font-size="16" font-weight="500" fill="#1a2238">Sıra zorunlu değil, her D bir giriş noktası olabilir</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="title desc" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Yetenekler haritası: on iki sayfa, üç grup</title>
  <desc id="desc">Üç sütun. Temel dört, ilk iki haftada: Skills, Dosya İşleme, Artifacts, Görsel ve Görüntü. İleri yetenekler, ihtiyaç olunca: Context ve Compaction, Agents ve Subagents, Computer Use. Destekleyenler, yeni ve tamamlayıcı: Memory, Code Execution, Research Mode, Effort Control, Claude Design. Altta soldan sağa ok: önce temel dört, diğerleri ihtiyaç oldukça.</desc>

  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a84c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="620" rx="16" fill="#ffffff"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#0f2855">Yetenekler haritası</text>
  <text x="40" y="88" font-size="16" font-weight="500" fill="#1a2238">12 sayfa, üç grup</text>

  <!-- Group headers -->
  <rect x="24" y="112" width="236" height="78" rx="10" fill="#0f2855"/>
  <text x="142" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Temel dört</text>
  <text x="142" y="172" text-anchor="middle" font-size="16" font-weight="500" fill="#f7f0dc">ilk iki haftada</text>

  <rect x="282" y="112" width="236" height="78" rx="10" fill="#e8edf6" stroke="#0f2855" stroke-width="2"/>
  <text x="400" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#0f2855">İleri yetenekler</text>
  <text x="400" y="172" text-anchor="middle" font-size="16" font-weight="500" fill="#1a2238">ihtiyaç olunca</text>

  <rect x="540" y="112" width="236" height="78" rx="10" fill="#f7f0dc" stroke="#c9a84c" stroke-width="2"/>
  <text x="658" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#0f2855">Destekleyenler</text>
  <text x="658" y="172" text-anchor="middle" font-size="16" font-weight="500" fill="#1a2238">yeni ve tamamlayıcı</text>

  <!-- Items -->
  <g font-size="18" font-weight="500" fill="#1a2238" text-anchor="middle">
    <g fill="#ffffff" stroke="#c5cdda" stroke-width="2">
      <rect x="24" y="206" width="236" height="54" rx="10"/>
      <rect x="24" y="272" width="236" height="54" rx="10"/>
      <rect x="24" y="338" width="236" height="54" rx="10"/>
      <rect x="24" y="404" width="236" height="54" rx="10"/>

      <rect x="282" y="206" width="236" height="54" rx="10"/>
      <rect x="282" y="272" width="236" height="54" rx="10"/>
      <rect x="282" y="338" width="236" height="54" rx="10"/>

      <rect x="540" y="206" width="236" height="54" rx="10"/>
      <rect x="540" y="272" width="236" height="54" rx="10"/>
      <rect x="540" y="338" width="236" height="54" rx="10"/>
      <rect x="540" y="404" width="236" height="54" rx="10"/>
      <rect x="540" y="470" width="236" height="54" rx="10"/>
    </g>

    <text x="142" y="239">Skills</text>
    <text x="142" y="305">Dosya İşleme</text>
    <text x="142" y="371">Artifacts</text>
    <text x="142" y="437">Görsel ve Görüntü</text>

    <text x="400" y="239">Context ve Compaction</text>
    <text x="400" y="305">Agents ve Subagents</text>
    <text x="400" y="371">Computer Use</text>

    <text x="658" y="239">Memory</text>
    <text x="658" y="305">Code Execution</text>
    <text x="658" y="371">Research Mode</text>
    <text x="658" y="437">Effort Control</text>
    <text x="658" y="503">Claude Design</text>
  </g>

  <!-- Learning direction -->
  <line x1="60" y1="558" x2="738" y2="558" stroke="#c9a84c" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <text x="400" y="594" text-anchor="middle" font-size="16" font-weight="500" fill="#1a2238">Önce temel dört, diğerleri ihtiyaç oldukça</text>
</svg>
